[env:esp32s3]
; pioarduino = Arduino-ESP32 core 3.x (needed for USBMIDI and the new I2S API)
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

; ESP32-S3 N16R8: 16 MB flash (QIO), 8 MB octal PSRAM
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_16MB.csv

build_flags =
    -DARDUINO_USB_MODE=0          ; native USB in TinyUSB mode (required for USB MIDI)
    -DARDUINO_USB_CDC_ON_BOOT=0   ; Serial = UART0 (the "UART" USB-C port)
    -DBOARD_HAS_PSRAM
    -O2
    -I${platformio.packages_dir}/framework-arduinoespressif32/libraries/FS/src   ; USB lib needs FS.h (LDF misses it)

lib_ldf_mode = deep+
lib_deps =
    FS
    SD
    SPI
